{% extends 'biblioteca/base.html' %}

{% block titulo %}Entrar{% endblock %}

{% block conteudo %}
    <h1>Entrar</h1>

    {% if form.errors %}
        <p class="aviso aviso-warning">Usuario ou senha invalidos.</p>
    {% endif %}

    <form class="formulario" method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="acoes">
            <button type="submit" class="botao">Entrar</button>
        </div>
    </form>
{% endblock %}
